openapi: 3.1.0
info:
  title: Internal Layout Synthesis & Vision Auditing Contract
  version: 1.0.0
  description: >
    Shared API contract for real semantic layout synthesis in designer-eneik with Obsidian design tokens
    (#08090C, #11141C, emerald-500), Playwright vision harness rendering, and BARCAN-TAG-11 deontic gate verification.
paths:
  /api/v1/internal/layout/synthesize:
    post:
      summary: Synthesize semantic layout
      operationId: synthesizeLayout
      tags:
        - LayoutSynthesis
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LayoutSynthesisRequest'
      responses:
        '200':
          description: Layout successfully synthesized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LayoutSynthesisResponse'
        '400':
          description: Schema validation error or invalid payload parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '422':
          description: Semantic constraint violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

  /api/v1/internal/vision/audit:
    post:
      summary: Execute Playwright vision audit and deontic gate evaluation
      operationId: auditLayoutVision
      tags:
        - VisionAudit
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionAuditRequest'
      responses:
        '200':
          description: Vision audit completed and deontic gate evaluated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisionAuditResponse'
        '400':
          description: Invalid audit parameters or unsupported viewport
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'

components:
  schemas:
    ObsidianColorToken:
      type: string
      description: Allowed Obsidian palette tokens for zero optical noise and anti-slop design.
      enum:
        - '#08090C'
        - '#11141C'
        - '#10b981'
      examples:
        - '#08090C'
        - '#11141C'
        - '#10b981'

    ObsidianThemePalette:
      type: object
      required:
        - background
        - surface
        - accent
      properties:
        background:
          $ref: '#/components/schemas/ObsidianColorToken'
          default: '#08090C'
        surface:
          $ref: '#/components/schemas/ObsidianColorToken'
          default: '#11141C'
        accent:
          $ref: '#/components/schemas/ObsidianColorToken'
          default: '#10b981'

    ViewportDimension:
      type: object
      required:
        - width
        - height
        - label
      properties:
        label:
          type: string
          enum:
            - desktop
            - mobile
        width:
          type: integer
          enum:
            - 1440
            - 375
        height:
          type: integer
          enum:
            - 900
            - 812

    LayoutSynthesisRequest:
      type: object
      required:
        - layoutId
        - semanticNodes
        - tokens
        - targetViewport
      properties:
        layoutId:
          type: string
          format: uuid
        semanticNodes:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/SemanticNode'
        tokens:
          $ref: '#/components/schemas/ObsidianThemePalette'
        targetViewport:
          $ref: '#/components/schemas/ViewportDimension'

    SemanticNode:
      type: object
      required:
        - id
        - role
        - domSelector
      properties:
        id:
          type: string
        role:
          type: string
          enum:
            - container
            - hero
            - navigation
            - card
            - action
            - typography
        domSelector:
          type: string
        backgroundColor:
          $ref: '#/components/schemas/ObsidianColorToken'
        foregroundColor:
          type: string
        geometry:
          $ref: '#/components/schemas/DomGeometry'

    DomGeometry:
      type: object
      required:
        - x
        - y
        - width
        - height
      properties:
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number

    LayoutSynthesisResponse:
      type: object
      required:
        - layoutId
        - synthesizedAt
        - domTreeHtml
        - appliedTokens
        - viewport
      properties:
        layoutId:
          type: string
          format: uuid
        synthesizedAt:
          type: string
          format: date-time
        domTreeHtml:
          type: string
        appliedTokens:
          $ref: '#/components/schemas/ObsidianThemePalette'
        viewport:
          $ref: '#/components/schemas/ViewportDimension'

    VisionAuditRequest:
      type: object
      required:
        - layoutId
        - renderedUrlOrHtml
        - viewports
      properties:
        layoutId:
          type: string
          format: uuid
        renderedUrlOrHtml:
          type: string
          description: Direct rendering target URL or inline DOM snapshot
        viewports:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ViewportDimension'

    DeonticGateStatus:
      type: string
      enum:
        - PASSED
        - FAILED
        - BLOCKED

    DeonticGateResult:
      type: object
      required:
        - status
        - contrastRatio
        - wcagAaaCompliant
        - opticalNoiseScore
        - zeroOpticalNoiseCompliant
        - antiSlopPaletteCompliant
        - violations
      properties:
        status:
          $ref: '#/components/schemas/DeonticGateStatus'
        contrastRatio:
          type: number
          format: float
          description: Measured contrast ratio against background (#08090C)
          example: 7.25
        wcagAaaCompliant:
          type: boolean
          description: True if contrast >= 7.0 for normal text and >= 4.5 for large text
        opticalNoiseScore:
          type: number
          format: float
          description: Optical clutter / visual noise metric (must be 0.0 for pass)
          example: 0.0
        zeroOpticalNoiseCompliant:
          type: boolean
        antiSlopPaletteCompliant:
          type: boolean
          description: Enforces only approved tokens without extraneous gradients or unapproved hues
        violations:
          type: array
          items:
            $ref: '#/components/schemas/DeonticViolation'

    DeonticViolation:
      type: object
      required:
        - ruleId
        - selector
        - message
        - severity
      properties:
        ruleId:
          type: string
          enum:
            - BARCAN-TAG-11-CONTRAST-AAA
            - BARCAN-TAG-11-ZERO-OPTICAL-NOISE
            - BARCAN-TAG-11-ANTI-SLOP-PALETTE
        selector:
          type: string
        message:
          type: string
        severity:
          type: string
          enum:
            - ERROR
            - WARNING

    VisionAuditResponse:
      type: object
      required:
        - layoutId
        - auditedAt
        - overallGateStatus
        - viewportResults
      properties:
        layoutId:
          type: string
          format: uuid
        auditedAt:
          type: string
          format: date-time
        overallGateStatus:
          $ref: '#/components/schemas/DeonticGateStatus'
        viewportResults:
          type: array
          items:
            type: object
            required:
              - viewport
              - gateResult
              - screenshotArtifactPath
            properties:
              viewport:
                $ref: '#/components/schemas/ViewportDimension'
              gateResult:
                $ref: '#/components/schemas/DeonticGateResult'
              screenshotArtifactPath:
                type: string

    ValidationErrorResponse:
      type: object
      required:
        - code
        - message
        - errors
      properties:
        code:
          type: string
          example: INVALID_PAYLOAD
        message:
          type: string
        errors:
          type: array
          items:
            type: object
            required:
              - path
              - issue
            properties:
              path:
                type: string
              issue:
                type: string
